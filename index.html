<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Психология личности</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, Arial, sans-serif; background: #0f0e17; color: #e9e8f5; min-height: 100vh; }
.header { text-align: center; padding: 2rem 1.5rem 1.5rem; border-bottom: 1px solid #2e2c4a; }
.header h1 { font-size: 1.8rem; font-weight: 800; }
.header h1 span { color: #e8b86d; }
.subtitle { margin-top: 0.4rem; color: #888799; font-size: 0.9rem; }
.controls { max-width: 800px; margin: 1.5rem auto 0; padding: 0 1rem; display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.btn { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.55rem 1.2rem; border: 1.5px solid #2e2c4a; background: #1a1929; color: #e9e8f5; border-radius: 6px; cursor: pointer; }
.btn.primary { background: #e8b86d; color: #0f0e17; border-color: #e8b86d; }
.stats { font-size: 0.82rem; color: #888799; }
.stats strong { color: #e8b86d; }
.prog-wrap { max-width: 800px; margin: 0.8rem auto 0; padding: 0 1rem; }
.prog-track { height: 3px; background: #2e2c4a; border-radius: 2px; }
.prog-fill { height: 100%; background: linear-gradient(90deg, #7c6af0, #e8b86d); border-radius: 2px; transition: width 0.3s; }
.filters { max-width: 800px; margin: 1rem auto 0; padding: 0 1rem; display: flex; gap: 0.4rem; flex-wrap: wrap; }
.fbtn { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.3rem 0.8rem; border: 1px solid #2e2c4a; background: transparent; color: #888799; border-radius: 20px; cursor: pointer; }
.fbtn.on { background: #7c6af0; color: white; border-color: #7c6af0; }
.main { max-width: 800px; margin: 1.2rem auto 0; padding: 0 1rem 2rem; }
.card { background: #1a1929; border: 1px solid #2e2c4a; border-radius: 10px; margin-bottom: 1.2rem; overflow: hidden; }
.card-head { display: flex; gap: 0.8rem; padding: 1.2rem 1.2rem 0.8rem; border-bottom: 1px solid #2e2c4a; }
.qnum { font-size: 0.68rem; font-weight: 700; color: #e8b86d; background: rgba(232,184,109,0.1); padding: 0.2rem 0.5rem; border-radius: 4px; white-space: nowrap; flex-shrink: 0; margin-top: 0.1rem; }
.qtext { font-size: 0.97rem; line-height: 1.55; }
.hint { font-size: 0.7rem; color: #7c6af0; margin-top: 0.25rem; }
.opts { padding: 0.8rem 1.2rem 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; }

.opt:active { background: rgba(124,106,240,0.1); }
.opt.sel { border-color: #7c6af0; background: rgba(124,106,240,0.1); }
.opt.ok { border-color: #4ade80; background: rgba(74,222,128,0.08); }
.opt.no { border-color: #f87171; background: rgba(248,113,113,0.08); }
.opt.off { cursor: default; }
.okey { font-size: 0.72rem; font-weight: 700; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #232236; color: #888799; flex-shrink: 0; margin-top: 0.15rem; }
.opt.ok .okey { background: #4ade80; color: #0f0e17; }
.opt.no .okey { background: #f87171; color: #0f0e17; }
.opt.sel .okey { background: #7c6af0; color: white; }
.result { padding: 0.5rem 1.2rem; font-size: 0.8rem; font-weight: 700; display: none; border-top: 1px solid #2e2c4a; }
.result.show { display: block; }
.result.good { color: #4ade80; }
.result.bad { color: #f87171; }
.more-wrap { text-align: center; padding: 0.5rem 0 2.5rem; }
#score { display: none; text-align: center; padding: 3rem 1.5rem; }
#score.show { display: block; }
.score-n { font-size: 5rem; font-weight: 800; color: #e8b86d; line-height: 1; }
.score-l { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: #888799; margin-top: 0.4rem; margin-bottom: 2rem; }
.score-d { font-size: 0.95rem; color: #888799; margin-bottom: 2rem; }
.score-d strong { color: #e9e8f5; }
</style>
</head>
<body>

<div class="header">
  <h1>Психология <span>личности</span></h1>
  <p class="subtitle">Тест · <strong style="color:#e8b86d">378</strong> вопросов</p>
</div>

<div class="controls">
  <div class="stats" id="stats">Загрузка...</div>
  <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
    <button class="btn" onclick="shuffleQ()">Перемешать</button>
    <button class="btn" onclick="resetAll()">Сбросить</button>
    <button class="btn primary" onclick="showScore()">Результат</button>
  </div>
</div>

<div class="prog-wrap"><div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div></div>

<div class="filters">
  <button class="fbtn on" onclick="setF('all',this)">Все</button>
  <button class="fbtn" onclick="setF('unanswered',this)">Не отвечено</button>
  <button class="fbtn" onclick="setF('wrong',this)">Ошибки</button>
  <button class="fbtn" onclick="setF('correct',this)">Правильные</button>
</div>

<div class="main" id="container"></div>
<div class="more-wrap" id="more-wrap" style="display:none">
  <button class="btn" id="more-btn" onclick="loadMore()">Загрузить ещё</button>
</div>

<div id="score">
  <div class="score-n" id="score-n">—</div>
  <div class="score-l">правильных ответов</div>
  <div class="score-d" id="score-d"></div>
  <button class="btn primary" onclick="resetAll()" style="margin-right:0.5rem">Пройти снова</button>
  <button class="btn" onclick="workErrors()">Работать над ошибками</button>
</div>

 "text": "Регрессии"}, {"key": "E", "text": "Проекции"}], "correct": ["A"], "multi": false}, {"num": "165", "text": "Искреннее удивление студентки в ответ на повторное требование преподавателя принести допуск к занятию («Разве Вы меня уже просили? Я ничего такого не помню!») ЯВЛЯЕТСЯ ПРИМЕРОМ СЛЕДУЮЩЕГО ЗАЩИТНОГО МЕХАНИЗМА:", "options": [{"key": "A", "text": "рационализация"}, {"key": "B", "text": "вытеснение"}, {"key": "C", "text": "отрицание"}, {"key": "D", "text": "регрессия"}, {"key": "E", "text": "проекция"}], "correct": ["B"], "multi": false}, {"num": "166", "text": "Поведение студента, который, услышав решение декана о его отчислении начинает хныкать и говорить, что он «больше не будет» является примером следующего защитного механизма:", "options": [{"key": "A", "text": "рационализации"}, {"key": "B", "text": "вытеснения"}, {"key": "C", "text": "отрицания"}, {"key": "D", "text": "регрессии"}, {"key": "E", "text": "проекции"}], "correct": ["D"], "multi": false}, {"num": "167", "text": "Группа родителей указала учителю физики на то, что его уроки «не достаточно насыщены информацией и класс отстает от программы.» В ответ он разозлился и заявил, что дети «так ленивы и бестолковы, что остается только удивляться, как они попали в выпускной класс». Это является примером ЗАЩИТНОГО МЕХАНИЗМА:", "options": [{"key": "A", "text": "рационализации"}, {"key": "B", "text": "отрицания"}, {"key": "C", "text": "фиксация тревоги"}, {"key": "D", "text": "регрессии"}, {"key": "E", "text": "проекции"}], "correct": ["E"], "multi": false}, {"num": "168", "text": "Женщина-доцент, которая прежде не уделяла много внимания внешности, готовясь к своей первой лекции, поправляет прическу, просит сотрудников посмотреть, «не выбились ли волосы сзади», опять берется за расческу, сбрызгивает волосы лаком, но все равно остается недовольной. Это поведение ЯВЛЯЕТСЯ ПРИМЕРОМ СЛЕДУЮЩЕГО ЗАЩИТНОГО МЕХАНИЗМА:", "options": [{"key": "A", "text": "обесценивание"}, {"key": "B", "text": "конверсии"}, {"key": "C", "text": "фиксация тревоги"}, {"key": "D", "text": "гиперкомпенсация"}, {"key": "E", "text": "расщепления"}], "correct": ["D"], "multi": false}, {"num": "169", "text": "Руководитель предприятия, хитрый и изворотливый человек, раздражён действиями своих подчинённых. Называет их глупцами и интриганами: «Ни одного честного человека! Все хитрят и юлят! Вот я всегда честно говорю то, что думаю!». Это высказывание пример ЗАЩИТНОГО МЕХАНИЗМА:", "options": [{"key": "A", "text": "обесценивания"}, {"key": "B", "text": "конверсии"}, {"key": "C", "text": "идентификации"}, {"key": "D", "text": "регрессии"}, {"key": "E", "text": "расщепления"}], "correct": ["E"], "multi": false}, {"num": "170", "text": "Мягкий и нерешительный человек, узнав об измене жены, проявил удивительную твердость, тут же выставил вещи жены за дверь, с каменным лицом выслушал все ее извинения, уверения в любви и привязанности. Выслушал просьбу тещи «подумать еще», но не изменил своего решения. Это поведение ЯВЛЯЕТСЯ ПРИМЕРОМ СЛЕДУЮЩЕГО ЗАЩИТНОГО МЕХАНИЗМА:", "options": [{"key": "A", "text": "обесценивание"}, {"key": "B", "text": "вытеснение"}, {"key": "C", "text": "фиксация тревоги"}, {"key": "D", "text": "гиперкомпенсация"}, {"key": "E", "text": "конверсии"}], "correct": ["D"], "multi": false}, {"num": "171", "text": "Примадонна оперного театра была поражена известием, что главная партия в новой постановке отдана не ей, а молодой начинающей певице. Устроила скандал в дирекции, в этот момент у нее исчез голос, говорила шепотом, однако к началу вечернего спектакля голос восстановился. Это ЯВЛЯЕТСЯ ПРИМЕРОМ СЛЕДУЮЩЕГО ЗАЩИТНОГО МЕХАНИЗМА:", "options": [{"key": "A", "text": "сублимации"}, {"key": "B", "text": "конверсии"}, {"key": "C", "text": "фиксация тревоги"}, {"key": "D", "text": "гиперкомпенсация"}, {"key": "E", "text": "расщепления"}], "correct": ["B"], "multi": false}, {"num": "172", "text": "Молодой врач, недавний выпускник мединститута, обращается к больным, по примеру своих старших коллег, не по имени-отчеству, а снисходительно «детка», «бабка», «дружочек», «батенька». При этом не допускает ни малейшей фамильярности в свой адрес. Такое поведение ЯВЛЯЕТСЯ ПРИМЕРОМ СЛЕДУЮЩЕГО ЗАЩИТНОГО МЕХАНИЗМА:", "options": [{"key": "A", "text": "обесценивание"}, {"key": "B", "text": "конверсии"}, {"key": "C", "text": "идентификации"}, {"key": "D", "text": "гиперкомпенсации"}, {"key": "E", "text": "проекции"}], "correct": ["C"], "multi": false}, {"num": "173", "text": "Душевная, но несколько пессимистичная одинокая женщина, в ответ на уговоры подруги приободриться, привести себя в порядок, познакомиться с неженатым мужчиной, который ею заинтересуется, заявляет: «Не стоила тебе хлопотать! Мне теперь уже ничего не нужно!» Такое высказывание ЯВЛЯЕТСЯ ПРИМЕРОМ СЛЕДУЮЩЕГО ЗАЩИТНОГО МЕХАНИЗМА:", "options": [{"key": "A", "text": "обесценивание"}, {"key": "B", "text": "конверсии"}, {"key": "C", "text": "фиксация тревоги"}, {"key": "D", "text": "сублимации"}, {"key": "E", "text": "проекции"}], "correct": ["A"], "multi": false}, {"num": "174", "text": "Проявлениями защитного механизма ИДЕНТИФИКАЦИИ являются:", "options": [{"key": "A", "text": "неуместное упрямство, принципиальность, вспышки щедрости"}, {"key": "B", "text": "внезапная забывчивость, поведение, «как будто ничего не случилось»"}, {"key": "C", "text": "капризность, хныканье, детское лепетание, надутые губы"}, {"key": "D", "text": "Построение ритуалов, избегание \"опасных\" ситуаций, навязчивости"}, {"key": "E", "text": "Невольное копирование поведения более авторитетного лица"}], "correct": ["E"], "multi": false}, {"num": "175", "text": "Проявлениями защитного механизма ГИПЕРКОМПЕНСАЦИИ являются:", "options": [{"key": "A", "text": "неуместное упрямство, принципиальность, вспышки щедрости"}, {"key": "B", "text": "внезапная забывчивость, поведение, «как будто ничего не случилось»"}, {"key": "C", "text": "капризность, хныканье, детское лепетание, надутые губы"}, {"key": "D", "text": "построение ритуалов, избегание \"опасных\" ситуаций, навязчивости"}, {"key": "E", "text": "невольное копирование поведения более авторитетного лица"}], "correct": ["A"], "multi": false}, {"num": "176", "text": "Проявлениями защитного механизма ВЫТЕСНЕНИЯ являются:", "options": [{"key": "A", "text": "неуместное упрямство, принципиальность, вспышки щедрости"}, {"key": "B", "text": "внезапная забывчивость, поведение, «как будто ничего не случилось»"}, {"key": "C", "text": "капризность, хныканье, детское лепетание, надутые губы"}, {"key": "D", "text": "построение ритуалов, избегание \"опасных\" ситуаций, навязчивости"}, {"key": "E", "text": "невольное копирование поведения более автортетного лица"}], "correct": ["B"], "multi": false}, {"num": "177", "text": "Проявлениями защитного механизма РЕГРЕССИИ являются:", "options": [{"key": "A", "text": "неуместное упрямство, принципиальность, вспышки щедрости"}, {"key": "B", "text": "внезапная забывчивость, поведение, «как будто ничего не случилось»"}, {"key": "C", "text": "капризность, хныканье, детское лепетание, надутые губы"}, {"key": "D", "text": "построение ритуалов, избегание \"опасных\" ситуаций, навязчивости"}, {"key": "E", "text": "невольное копирование поведения более автортетного лица"}], "correct": ["C"], "multi": false}, {"num": "178", "text": "Проявлениями защитного механизма ФИКСАЦИИ ТРЕВОГИ являются:", "options": [{"key": "A", "text": "неуместное упрямство, принципиальность, вспышки щедрости"}, {"key": "B", "text": "внезапная забывчивость, поведение, «как будто ничего не случилось»"}, {"key": "C", "text": "капризность, хныканье, детское лепетание, надутые губы"}, {"key": "D", "text": "построение ритуалов, избегание \"опасных\" ситуаций, навязчивости"}, {"key": "E", "text": "невольное копирование поведения более авторитетного лица"}], "correct": ["D"], "multi": false}, {"num": "179", "text": "Проявлениями защитного механизма ИДЕНТИФИКАЦИИ являются:", "options": [{"key": "A", "text": "неуместное упрямство, принципиальность, вспышки щедрости"}, {"key": "B", "text": "внезапная забывчивость, поведение, «как будто ничего не случилось»"}, {"key": "C", "text": "капризность, хныканье, детское лепетание, надутые губы"}, {"key": "D", "text": "построение ритуалов, избегание \"опасных\" ситуаций, навязчивости"}, {"key": "E", "text": "невольное копирование поведения более авторитетного лица"}], "correct": ["E"], "multi": false}, {"num": "180", "text": "Все люди вне зависимости от личностных особенностей и степени адаптации используют те или иные механизмы психологической защиты.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["A"], "multi": false}, {"num": "181", "text": "Механизмы психологической защиты не приводят человека к дезадаптации только если они используются сознательно и обдуманно.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["B"], "multi": false}, {"num": "182", "text": "Тип личности больного определяет набор типичных механизмов психологической защиты.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["A"], "multi": false}, {"num": "183", "text": "Использование все время одних и тех же стандартных механизмов психологической защиты приводит к нарушению социальных связей и дезадаптации.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["A"], "multi": false}, {"num": "184", "text": "Человек обычно значительно легче переносит фрустрирующую ситуацию, если препятствие к реализации потребности являются его внутренние переживания, а не внешние обстоятельства.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["B"], "multi": false}, {"num": "185", "text": "Чем чаще используются механизмы психологической защиты, чем интенсивнее и длительнее они проявляются в жизни, тем более адаптированным будет человек.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["B"], "multi": false}, {"num": "186", "text": "Применение механизмов психологической защиты является наиболее адаптивным способом преодоления психотравмирующей ситуации, ПОТОМУ ЧТО механизмы защиты полностью устраняют источник тревоги.", "options": [{"key": "A", "text": "Утверждение 1 верно, утверждение 2 верно, связь верна"}, {"key": "B", "text": "Утверждение 1 верно, утверждение 2 верно, связь неверна"}, {"key": "C", "text": "Утверждение 1 верно, утверждение 2 неверно, связь неверна"}, {"key": "D", "text": "Утверждение 1 неверно, утверждение 2 верно, связь неверна"}, {"key": "E", "text": "Оба утверждения неверны"}], "correct": ["E"], "multi": false}, {"num": "187", "text": "Из всех возможных путей разрешения психотравмирующей ситуации применение механизмов психологической защиты является наиболее эффективным и адаптивным.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["B"], "multi": false}, {"num": "188", "text": "Укажите автора, описавшего следующие понятия СТРЕСС -- ДИСТРЕСС -- ОБЩИЙ СИНДРОМ АДАПТАЦИИ", "options": [{"key": "A", "text": "Лурия"}, {"key": "B", "text": "Зейгарник"}, {"key": "C", "text": "Берн"}, {"key": "D", "text": "Левин"}, {"key": "E", "text": "Селье"}], "correct": ["E"], "multi": false}, {"num": "189", "text": "Укажите автора, описавшего следующие понятия ВНУТРЕННЯЯ КАРТИНА БОЛЕЗНИ", "options": [{"key": "A", "text": "Лурия"}, {"key": "B", "text": "Зейгарник"}, {"key": "C", "text": "Берн"}, {"key": "D", "text": "Левин"}, {"key": "E", "text": "Селье"}], "correct": ["A"], "multi": false}, {"num": "190", "text": "Наличие достаточных сведений у пациента (например, если пациентом является врач) исключает возможность возникновения дисгармоничной внутренней картины болезни.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["B"], "multi": false}, {"num": "191", "text": "При наличии у больного фиктивной внутренней картины болезни основной задачей психотерапевтической работы врача становится разрушение сложившейся у пациента фиктивной концепции.", "options": [{"key": "A", "text": "Верно"}, {"key": "B", "text": "Ложно"}], "correct": ["B"], "multi": false}, {"num": "192", "text": "Понятие ВНУТРЕННЯЯ КАРТИНА БОЛЕЗНИ включает в себя следующие явления и факты:", "options": [{"key": "1", "text": "генотип пациента, определивший наличие болезни"}, {"key": "2", "text": "ощущаемое больным недомогание, боль, беспомощность"}, {"key": "3", "text": "патологическая активность ферментов организма"}, {"key": "4", "text": "знания больного о способах лечения данного заболевания"}], "correct": ["2", "4"], "multi": true}, {"num": "193", "text": "Понятие ВНУТРЕННЯЯ КАРТИНА БОЛЕЗНИ включает в себя следующие явления и факты:", "options": [{"key": "1", "text": "представления больного о том, что такое «здоровье»"}, {"key": "2", "text": "чувство стыда, испытываемое с связи с диагностированной болезнью"}, {"key": "3", "text": "подозрительное и негативное отношение к лекарствам"}, {"key": "4", "text": "сведения о болезни, почерпнутые из популярной и медицинской литературы"}], "correct": ["1", "2", "3", "4"], "multi": true}, {"num": "194", "text": "Понятие ВНУТРЕННЯЯ КАРТИНА БОЛЕЗНИ включает в себя следующие явления и факты:", "options": [{"key": "1", "text": "сомнения в компетентности врачей"}, {"key": "2", "text": "неудовлетворённость результатами лечения"}, {"key": "3", "text": "ошибочная уверенность в наличии серьёзного заболевания"}, {"key": "4", "text": "уровень интеллекта пацика, опред. с помощью тестов"}], "correct": ["1", "2", "3"], "multi": true}, {"num": "195", "text": "Понятие ВНУТРЕННЯЯ КАРТИНА БОЛЕЗНИ включает в себя следующие явления и факты:", "options": [{"key": "1", "text": "воспоминания о родственнике, умершего от той же болезни"}, {"key": "2", "text": "наличие необратимых изменений во внутренних органах"}, {"key": "3", "text": "чувство у пацика, что диагносцированная у него болезнь протекает странно, атипично"}, {"key": "4", "text": "возраст, уровень образования, проф. квалифи var BATCH = 20;
var qs = [], ans = {}, filter = 'all', visible = [], rendered = 0;

function nk(k) {
  var m = {'А':'A','В':'B','С':'C','Д':'D','Е':'E','Ё':'E'};
  return (m[k.toUpperCase()] || k.toUpperCase());
}

function isOk(idx, sel) {
  var q = qs[idx];
  var a = q.correct.map(nk).sort().join(',');
  var b = (sel||[]).map(nk).sort().join(',');
  return a === b;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildVisible() {
  visible = [];
  for (var i = 0; i < qs.length; i++) {
    var a = ans[i], ok = a && isOk(i,a), bad = a && !ok;
    if (filter === 'unanswered' && a) continue;
    if (filter === 'wrong' && !bad) continue;
    if (filter === 'correct' && !ok) continue;
    visible.push(i);
  }
}

function makeCard(idx) {
  var q = qs[idx], a = ans[idx];
  var ok = a && isOk(idx,a);
  var ck = q.correct.map(nk);
  var sk = a ? a.map(nk) : [];

  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'c'+idx;

  var hint = q.multi ? '<div class="hint">&#9671; Несколько ответов &mdash; выберите все и подтвердите</div>' : '';
  card.innerHTML =
    '<div class="card-head">' +
      '<span class="qnum">&#8470;' + esc(q.num) + '</span>' +
      '<div><div class="qtext">' + esc(q.text) + '</div>' + hint + '</div>' +
    '</div>' +
    '<div class="opts" id="o'+idx+'"></div>' +
    '<div class="result" id="r'+idx+'"></div>';

  document.getElementById('container').appendChild(card);

  var oc = document.getElementById('o'+idx);
  for (var j = 0; j < q.options.length; j++) {
    (function(opt) {
      var kn = nk(opt.key);
      var btn = document.createElement('button');
      btn.className = 'opt' + (a ? ' off' + (ck.indexOf(kn)!==-1?' ok':(sk.indexOf(kn)!==-1?' no':'')) : (sk.indexOf(kn)!==-1?' sel':''));
      btn.setAttribute('data-k', opt.key);
      btn.innerHTML = '<span class="okey">'+esc(opt.key)+'</span><span>'+esc(opt.text)+'</span>';
      if (!a) btn.onclick = function() { pick(idx, opt.key, q.multi); };
      oc.appendChild(btn);
    })(q.options[j]);
  }

  if (a) showResult(idx, ok, q.correct);
}

function loadMore() {
  var end = Math.min(rendered + BATCH, visible.length);
  for (var i = rendered; i < end; i++) makeCard(visible[i]);
  rendered = end;
  var wrap = document.getElementById('more-wrap');
  var btn = document.getElementById('more-btn');
  if (rendered < visible.length) {
    wrap.style.display = 'block';
    btn.textContent = 'Загрузить ещё (' + (visible.length - rendered) + ')';
  } else {
    wrap.style.display = 'none';
  }
  updateStats();
}

function renderAll() {
  document.getElementById('container').innerHTML = '';
  document.getElementById('score').classList.remove('show');
  document.getElementById('more-wrap').style.display = 'none';
  rendered = 0;
  buildVisible();
  loadMore();
}

function pick(idx, key, multi) {
  if (!ans[idx]) ans[idx] = [];
  var kn = nk(key);
  if (multi) {
    var found = -1;
    for (var i = 0; i < ans[idx].length; i++) if (nk(ans[idx][i])===kn) { found=i; break; }
    var btn = document.querySelector('#o'+idx+' [data-k="'+key+'"]');
    if (found===-1) { ans[idx].push(key); if(btn) btn.className='opt sel'; }
    else { ans[idx].splice(found,1); if(btn) btn.className='opt'; }
    var card = document.getElementById('c'+idx);
    if (!card.querySelector('.confirm-btn')) {
      var cb = document.createElement('button');
      cb.className = 'btn primary confirm-btn';
      cb.style.cssText = 'margin:0 1.2rem 1rem;';
      cb.textContent = 'Подтвердить';
      cb.onclick = function() {
        if (ans[idx] && ans[idx].length) { lock(idx); cb.parentNode.removeChild(cb); }
      };
      card.appendChild(cb);
    }
  } else {
    ans[idx] = [key];
    lock(idx);
  }
}

function lock(idx) {
  var q = qs[idx];
  var ck = q.correct.map(nk);
  var sk = ans[idx].map(nk);
  var ok = isOk(idx, ans[idx]);
  var btns = document.querySelectorAll('#o'+idx+' .opt');
  for (var i = 0; i < btns.length; i++) {
    var kn = nk(btns[i].getAttribute('data-k'));
    btns[i].onclick = null;
    btns[i].className = 'opt off' + (ck.indexOf(kn)!==-1?' ok':(sk.indexOf(kn)!==-1?' no':''));
  }
  showResult(idx, ok, q.correct);
  updateStats();
}

function showResult(idx, ok, correct) {
  var r = document.getElementById('r'+idx);
  if (!r) return;
  r.className = 'result show ' + (ok ? 'good' : 'bad');
  r.textContent = ok ? '✓ Верно!' : '✗ Неверно. Правильный ответ: ' + correct.join(', ');
}

function updateStats() {
  var total = qs.length, answered = 0, correct = 0;
  for (var k in ans) { if (ans.hasOwnProperty(k)) { answered++; if (isOk(+k,ans[k])) correct++; } }
  var pct = answered > 0 ? Math.round(correct/answered*100) : 0;
  document.getElementById('stats').innerHTML =
    'Отвечено: <strong>'+answered+'/'+total+'</strong> &nbsp;&middot;&nbsp; Правильно: <strong>'+correct+'</strong> &nbsp;&middot;&nbsp; Точность: <strong>'+pct+'%</strong>';
  document.getElementById('prog').style.width = (total>0?answered/total*100:0)+'%';
}

function shuffleQ() {
  for (var i=qs.length-1;i>0;i--) { var j=Math.floor(Math.random()*(i+1)); var t=qs[i];qs[i]=qs[j];qs[j]=t; }
  ans={};
  renderAll();
}

function resetAll() {
  qs=Q.slice(); ans={}; filter='all';
  var fb=document.querySelectorAll('.fbtn');
  for(var i=0;i<fb.length;i++) fb[i].classList.toggle('on',i===0);
  renderAll();
}

function showScore() {
  var total=qs.length, answered=0, correct=0;
  for(var k in ans){if(ans.hasOwnProperty(k)){answered++;if(isOk(+k,ans[k]))correct++;}}
  var pct=total>0?Math.round(correct/total*100):0;
  document.getElementById('score-n').textContent=pct+'%';
  document.getElementById('score-d').innerHTML='<strong>'+correct+'</strong> из <strong>'+total+'</strong> · Не отвечено: <strong>'+(total-answered)+'</strong>';
  document.getElementById('container').innerHTML='';
  document.getElementById('more-wrap').style.display='none';
  document.getElementById('score').classList.add('show');
  window.scrollTo(0,0);
}

function workErrors() {
  filter='wrong';
  var fb=document.querySelectorAll('.fbtn');
  for(var i=0;i<fb.length;i++) fb[i].classList.toggle('on',i===2);
  document.getElementById('score').classList.remove('show');
  renderAll();
}

function setF(f,el) {
  filter=f;
  var fb=document.querySelectorAll('.fbtn');
  for(var i=0;i<fb.length;i++) fb[i].classList.remove('on');
  if(el) el.classList.add('on');
  renderAll();
}

qs = Q.slice();
renderAll();
</script>
